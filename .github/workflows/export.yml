# Multi-platform export matrix (manual trigger). Android CI lives in ci.yml.
#
# Version pin (checked against GitHub releases on 2026-10-13):
#   - Zylann/godot_voxel tag v1.7x = "Voxel Tools GDExtension 1.7 for Godot 4.5+",
#     asset GodotVoxelExtension.zip (unzip at the project root, plugin-style).
#     The matching custom module build is tag v1.7 = Godot 4.7.2.stable + Voxel Tools 1.7.
#   - godotengine/godot tag 4.7.2-stable: Godot_v4.7.2-stable_linux.x86_64.zip and
#     Godot_v4.7.2-stable_export_templates.tpz both exist.
#   ⚠ PHOENIX VOXEL DEV BOT IS PINNING THE FINAL VERSION. These values are a proposal.
#     project.godot currently declares features "4.3"; it must be bumped to 4.5+ for the
#     extension. Not changed here because Dev Bot owns project.godot.
#
# Secrets (release signing, optional; debug builds work without them):
#   ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_USER, ANDROID_RELEASE_KEYSTORE_PASSWORD
name: export-draft
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release-sign Android (requires secrets)"
        type: boolean
        default: false
env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  VOXEL_TAG: "v1.7x"
jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: "Android", file: "android/phoenix-voxel.apk" }
          - { preset: "Linux",   file: "linux/phoenix.x86_64" }
          - { preset: "Windows", file: "windows/phoenix.exe" }
          - { preset: "macOS",   file: "macos/phoenix-macos.zip" }
          - { preset: "Web",     file: "web/index.html" }
          - { preset: "iOS",     file: "ios/phoenix.ipa" }  # Xcode project only; needs a Mac to sign
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot editor + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_TAG}
          curl -fsSLO $base/Godot_v${GODOT_TAG}_linux.x86_64.zip
          curl -fsSLO $base/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip && mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir" && unzip -q Godot_v${GODOT_TAG}_export_templates.tpz -d /tmp/t && mv /tmp/t/templates/* "$tdir"/

      - name: Install godot_voxel GDExtension
        run: |
          curl -fsSL -o voxel.zip https://github.com/Zylann/godot_voxel/releases/download/${VOXEL_TAG}/GodotVoxelExtension.zip
          unzip -q -o voxel.zip -d .
          # Check that the binaries cover each target (web/iOS may be missing). See docs/PLATFORMS_TESTING.md.
          find . -name '*.gdextension' -not -path './.git/*' -print -exec cat {} \;

      # ---- Android only (official setup actions) ----
      - name: Set up JDK 17
        if: matrix.preset == 'Android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Set up Android SDK
        if: matrix.preset == 'Android'
        uses: android-actions/setup-android@v3   # community action (not GitHub-owned); widely used
      - name: Install SDK packages
        if: matrix.preset == 'Android'
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Generate debug keystore
        if: matrix.preset == 'Android'
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Decode release keystore from secrets
        if: matrix.preset == 'Android' && inputs.release
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Point Godot editor settings at the Android SDK
        if: matrix.preset == 'Android'
        run: |
          # Godot reads android_sdk_path from editor settings (no env var). Path/filename to verify for 4.7.
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres

      - name: Import project
        run: ./godot --headless --import || true
      - name: Export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "build/$(dirname '${{ matrix.file }}')"
          mode=--export-debug
          if [ "${{ matrix.preset }}" = "Android" ] && [ "${{ inputs.release }}" = "true" ]; then mode=--export-release; fi
          ./godot --headless $mode "${{ matrix.preset }}" "build/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-${{ matrix.preset }}
          path: build/
