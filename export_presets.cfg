; Android export preset. NO keystore secrets here: set them in
; Editor > Editor Settings > Export > Android, or via env vars
; GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD in CI.
[preset.0]
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, companions/*/*.json"
exclude_filter=""
export_path="build/phoenix-voxel.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk="26"
gradle_build/target_sdk="34"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version/code=1
version/name="0.1.0"
package/unique_name="com.anterrania.phoenixvoxel"
package/name="Phoenix Voxel Companion"
package/signed=true
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
launcher_icons/main_192x192=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
permissions/access_network_state=true
permissions/record_audio=false
permissions/vibrate=true
