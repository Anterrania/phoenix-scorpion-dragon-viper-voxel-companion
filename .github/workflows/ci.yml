# CI: headless tests + Android arm64 debug APK on every push / PR.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  VOXEL_TAG: "v1.7x"
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: Install Godot + Voxel Tools GDExtension
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_TAG}
          curl -fsSLO $base/Godot_v${GODOT_TAG}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip && mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          curl -fsSL -o voxel.zip https://github.com/Zylann/godot_voxel/releases/download/${VOXEL_TAG}/GodotVoxelExtension.zip
          unzip -q -o voxel.zip -d .
      - name: Import project
        run: ./godot --headless --import
      - name: Run tests
        run: ./godot --headless res://tests/test_runner.tscn
      - name: Install export templates
        run: |
          curl -fsSLO https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir" /tmp/t && unzip -q Godot_v${GODOT_TAG}_export_templates.tpz -d /tmp/t && mv /tmp/t/templates/* "$tdir"/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV" && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Debug keystore (stable, from secrets) + version
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KS_USER: ${{ secrets.DEBUG_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret missing; generating a throwaway key. This APK will NOT update over earlier installs."
            KS_USER=androiddebugkey; KS_PASS=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "KS_USER=${KS_USER:-androiddebugkey}" >> "$GITHUB_ENV"; echo "::add-mask::${KS_PASS:-android}"
          echo "KS_PASS=${KS_PASS:-android}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=${KS_USER:-androiddebugkey}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=${KS_PASS:-android}" >> "$GITHUB_ENV"
          # versionCode = 100 + run number (always increases); versionName from latest tag, else 0.12.x
          git fetch --tags --quiet || true
          tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          vname=$(echo "${tag:-v0.12.${{ github.run_number }}}" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          # v0.13: never go below the version already in export_presets.cfg (a bump lands before its tag)
          pname=$(sed -nE 's/^version\/name="([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' export_presets.cfg | head -1)
          vname=$(printf '%s\n%s\n' "$vname" "${pname:-0.0.0}" | sort -V | tail -1)
          vcode=$((100 + ${{ github.run_number }}))
          sed -i -E "s/^version\/code=.*/version\/code=$vcode/; s/^version\/name=.*/version\/name=\"$vname\"/" export_presets.cfg
          echo "Android versionCode=$vcode versionName=$vname"
      - name: Editor settings
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "%s"\nexport/android/debug_keystore_pass = "%s"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" "$RUNNER_TEMP/debug.keystore" "$KS_USER" "$KS_PASS" > ~/.config/godot/editor_settings-4.7.tres
      - name: Build ViperDevice Android plugin (AAR)
        run: |
          android/plugins/viper_device/build.sh
          size=$(stat -c %s addons/viper_device/bin/viper-device-release.aar)
          echo "ViperDevice AAR: $size bytes"; test "$size" -lt 65536
      - name: Build ViperLLM Android plugin (AAR, llama.cpp pinned b12017, MIT)
        run: |
          android/plugins/viper_llm/build.sh
          size=$(stat -c %s addons/viper_llm/bin/viper-llm-release.aar)
          echo "ViperLLM AAR: $size bytes"; test "$size" -lt 6291456
          unzip -l addons/viper_llm/bin/viper-llm-release.aar | grep -q 'jni/arm64-v8a/libviper_llm.so'
      - name: Export Android debug APK (Gradle build, ViperDevice + ViperLLM plugins)
        run: |
          mkdir -p build/android
          ./godot --headless --install-android-build-template --export-debug Android build/android/phoenix-voxel.apk
          test -s build/android/phoenix-voxel.apk
          ls -l build/android/phoenix-voxel.apk
          "$ANDROID_SDK_ROOT"/build-tools/34.0.0/aapt2 dump xmltree --file AndroidManifest.xml build/android/phoenix-voxel.apk | grep -q 'org.godotengine.plugin.v2.ViperDevice'
          unzip -p build/android/phoenix-voxel.apk 'classes*.dex' | grep -aq 'com/anterrania/viperdevice/ViperDevicePlugin'
          "$ANDROID_SDK_ROOT"/build-tools/34.0.0/aapt2 dump xmltree --file AndroidManifest.xml build/android/phoenix-voxel.apk | grep -q 'org.godotengine.plugin.v2.ViperLLM'
          unzip -p build/android/phoenix-voxel.apk 'classes*.dex' | grep -aq 'com/anterrania/viperllm/ViperLlmPlugin'
          unzip -l build/android/phoenix-voxel.apk | grep -E 'lib/arm64-v8a/lib(viper_llm|llama|ggml-base|ggml-cpu-android_armv8.0_1)\.so' | wc -l | grep -qx 4
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-voxel-android-debug
          path: build/android/phoenix-voxel.apk
